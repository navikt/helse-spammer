[versions]
flyway = "11.5.0"
jackson3 = "3.2.2"
sasGradlePlugins = "20260923.0907"
tbdLibs = "20260917.2152"

[libraries]
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = "com.zaxxer:HikariCP:7.1.0"
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "tools.jackson.datatype:jackson-datatype-jsr310" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotliquery = "com.github.seratch:kotliquery:1.9.1"
mockk = "io.mockk:mockk:1.14.11"
postgresql = "org.postgresql:postgresql:42.7.13"
rapidsAndRivers = "com.github.navikt:rapids-and-rivers:2026091610031789545782"
rison = "com.bazaarvoice.jackson:rison:2.9.10.2"

tbdLibs-postgresTestdatabaser = { module = "com.github.navikt.tbd-libs:postgres-testdatabaser", version.ref = "tbdLibs" }
tbdLibs-rapidsAndRiversTest = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-test", version.ref = "tbdLibs" }
tbdLibs-retry = { module = "com.github.navikt.tbd-libs:retry", version.ref = "tbdLibs" }
tbdLibs-spurteduClient = { module = "com.github.navikt.tbd-libs:spurtedu-client", version.ref = "tbdLibs" }

[plugins]
sas-deployable = { id = "no.nav.helse.sas.sas-deployable", version.ref = "sasGradlePlugins" }
