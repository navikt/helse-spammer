[versions]
flyway = "13.11.1"
sykepengerGradlePlugins = "20261029.1945"
tbdLibs = "20261029.1843"

[libraries]
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = "com.zaxxer:HikariCP:7.1.0"
# Versjonene kommer fra jackson-BOM-ene som no.nav.sykepenger.kotlin-pluginen legger på
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotliquery = "com.github.seratch:kotliquery:1.9.1"
mockk = "io.mockk:mockk:1.14.11"
postgresql = "org.postgresql:postgresql:42.7.14"
rapidsAndRivers = "com.github.navikt:rapids-and-rivers:2026091610031789545782"

tbdLibs-postgresTestdatabaser = { module = "com.github.navikt.tbd-libs:postgres-testdatabaser", version.ref = "tbdLibs" }
tbdLibs-rapidsAndRiversTest = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-test", version.ref = "tbdLibs" }
tbdLibs-retry = { module = "com.github.navikt.tbd-libs:retry", version.ref = "tbdLibs" }
tbdLibs-personPseudoId = { module = "com.github.navikt.tbd-libs:person-pseudo-id", version.ref = "tbdLibs" }

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
